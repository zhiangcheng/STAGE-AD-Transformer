[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sexreg-ad-transformer"
version = "0.1.0"
description = "Sex-aware multi-task Transformer for Alzheimer disease regulatory prioritization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.0",
  "tqdm>=4.65",
  "networkx>=3.0",
]

[project.optional-dependencies]
baselines = [
  "xgboost>=1.7",
  "lightgbm>=4.0",
]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["sexreg_ad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
